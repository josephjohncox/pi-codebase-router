name: Publish

# Publishes to npm when a GitHub Release is published. Also runnable manually
# (with an optional dry run). Requires an `NPM_TOKEN` repository secret
# (npm "Automation" token). Provenance is attached via GitHub OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run (no upload)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json ($pkg)"
            exit 1
          fi
      - name: Publish
        run: npm publish --provenance --access public ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
