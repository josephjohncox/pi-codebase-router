name: Publish

# Publishes to npm via Trusted Publishing (OIDC) — no NPM_TOKEN needed.
# Requires a trusted publisher configured on npm for this repo + this workflow
# file, and npm >= 11.5.1 (installed below; Node's bundled npm is too old).
#
# Triggers:
#   - a published GitHub Release (tag must match package.json version), or
#   - manual dispatch (optionally --dry-run), which publishes main's HEAD.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run npm publish with --dry-run (no upload)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      # Public dependencies need no registry token. Do not synthesize an .npmrc
      # _authToken entry: publication authenticates with the job's OIDC identity.
      # Trusted publishing (OIDC) requires npm >= 11.5.1; upgrade the bundled npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Release tag $tag does not match package.json ($pkg)"
            exit 1
          fi
      # No NODE_AUTH_TOKEN: npm requests an OIDC token from GitHub automatically.
      - name: Publish
        run: npm publish --provenance --access public --loglevel=http ${{ (github.event_name == 'workflow_dispatch' && inputs.dry-run) && '--dry-run' || '' }}
